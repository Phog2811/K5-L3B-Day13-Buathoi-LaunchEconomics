# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu/nhóm; 42 người/nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < 20/0,02 = 1.000 < 1.251; với m = 75 chỉ đạt 604,84; tăng thời gian vẫn không đủ cho +5 điểm
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6/0,02 = 300 < 1.251; chỉ 6 cụm/nhóm, dưới mức tối thiểu 20 cụm
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người, DE = 6,96, n hiệu dụng = 859,20; 5.980 yêu cầu thực/nhóm, tổng 11.960
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng xử lý đồng thời trong cùng các tuần thí nghiệm tại các depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng script với seed cố định trước, phân tầng ngẫu nhiên theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ kinh nghiệm xử lý giữa nhân viên cùng depot; giảm thiểu bằng cấp quyền truy cập tính năng theo staff_id và ghi log mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã xác định trước chỉ số chính, ngưỡng dừng an toàn/chi phí/sử dụng và ngày chốt quyết định 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Đạt chính xác 20 cụm (20 nhân viên can thiệp và 20 nhân viên đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận thiết kế phát hiện mức chênh MDE = +6 điểm phần trăm thay vì +5 điểm; nếu tác động thực tế chỉ đạt +5 điểm phần trăm, power thống kê thực tế giảm xuống còn 64,17% (thấp hơn mục tiêu 80%).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn mẫu là 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97% (39/982). Ngưỡng an toàn chọn là không vượt đối chứng quá 2 điểm phần trăm và không vượt trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia và hang_nang (chi phí tương đối 0,22x và 0,69x so với 12.000 đ [simulated]); loại bỏ quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần (4 -> 10 -> 20 nhân viên)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm việc song song cùng ca/tuần với 20 nhân viên nhóm trợ lý"
    spillover_risk: "Phân quyền tính năng theo tài khoản staff_id cá nhân, ghi log từng lượt gọi gợi ý để phát hiện dùng chéo"
    predeclared: "Chỉ số, cỡ mẫu, MDE 6 điểm, 3 luật dừng và ngày quyết định chốt trước ngày rollout"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần tuyệt đối 6%, hoặc phát hiện >= 1 ca hoàn tiền trùng lặp TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành ra lệnh tắt trợ lý trong vòng 30 phút KHÔNG THÌ không được phép chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí lập tức thu hẹp phạm vi về chỉ noi_dia và siết giới hạn tối đa 2 lần chạy KHÔNG THÌ không được phép mở rộng sang hạng mục hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý của nhân viên vượt quá 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH tổ chức phỏng vấn chuyên sâu 5 nhân viên trong 3 ngày để tìm nguyên nhân UX/chất lượng gợi ý KHÔNG THÌ dừng việc tăng tỉ lệ phân bổ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn và rủi ro hoàn trùng lặp"
  rollback: "Giám đốc vận hành gạt cờ tắt hệ thống (feature flag), hiệu lực toàn mạng trong 30 phút; toàn bộ yêu cầu chuyển về quy trình nhân viên tự xử lý thủ công"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated: trung bình 5,03 phút/yêu cầu được xem lại, chi phí 2.000 đ/phút"
    - "phut_lam_lai_simulated: trung bình 15,30 phút/yêu cầu làm lại, chi phí 2.000 đ/phút"
    - "Tổng chi phí hệ thống 4.373.585 đ và chi phí mỗi việc thành công 4.472 đ"
    - "Ngưỡng hoà vốn thời gian xem lại khi xem lại 100% là 4,8 đến 5,1 phút/ca"

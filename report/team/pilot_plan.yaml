    - "NẾU chi phí mỗi việc thành công đo thật (từ agent_run_completed, staff_review_decision, staff_rework_completed) vượt 8.000 đ, hoặc tỉ lệ ca làm lại vượt 7%, hoặc thời gian xem lại trung bình vượt 5,0 phút/ca với tỉ lệ xem lại trên 50% (mức hoà vốn B4 là 4,8–5,1 phút, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia, giữ giới hạn tối đa 2 lần chạy và rà 20 trace làm lại gần nhất KHÔNG THÌ không được mở rộng tiếp hang_nang hoặc tăng bước rollout"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên staff_review_decision) vượt 40% hoặc tỉ lệ yêu cầu nhóm trợ lý được mở bằng trợ lý dưới 60% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH tổ chức phỏng vấn 5 nhân viên và phối hợp Kỹ sư trưởng agent sửa UX/prompt trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (ticket_reopened, hoàn tiền trùng) và chi phí vận hành theo tuần; không dừng sớm vì kết quả tích cực của chỉ số chính để bảo toàn alpha 0,05"

# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,80; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (z chính xác; statsmodels cho 1.250, lệch < 0,1%).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; cần 1.251 * 2,48 = 3.103 yêu cầu/nhóm -> 42 nhân viên/nhóm, tổng 84 > 40 nhân viên hiện có (không đủ người).
#   c) 20 nhân viên mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 20 / 0,02 = 1.000 < 1.251; với m = 75 chỉ đạt 604,84; tăng thời gian vẫn không đủ cho +5 điểm.
#   d) 6 depot mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 6 / 0,02 = 300 < 1.251; chỉ 6 cụm/nhóm, dưới mức tối thiểu 20 cụm.
#   e) Mức chênh 6 điểm (859 yêu cầu hiệu dụng/nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) * 0,02) >= 859 -> cần m >= 299 yêu cầu mỗi nhân viên (DE = 6,96; n hiệu dụng = 859,20; 5.980 yêu cầu thực/nhóm, tổng 11.960). Với ~1.500 yc/ngày * 81,83% trong phạm vi / 40 nhân viên (~30,7 yc/người/ngày), cần ~10 ngày ở bước 0.50 (chọn 2 tuần).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có — 20 nhân viên đối chứng và 20 nhân viên nhóm trợ lý xử lý song song cùng ca/tuần tại cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng script với seed cố định ghi trước, phân tầng theo 12 depot để cân bằng khối lượng và loại đơn.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chia sẻ kinh nghiệm hoặc gợi ý; giảm bằng phân quyền tài khoản theo staff_id, tách hàng đợi theo nhân viên và ghi log agent_suggestion_shown / staff_review_decision gắn staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có — chỉ số chính, MDE 0,06, ngưỡng an toàn, 3 luật dừng và ngày chốt quyết định 2027-01-05 đều chốt trước khi bật bước 0.10.
#   5. Ít nhất 20 cụm mỗi nhóm: Có — đạt chính xác 20 cụm mỗi nhóm (20 nhân viên can thiệp và 20 nhân viên đối chứng).
#
# Đánh đổi đã chấp nhận (vì 40 nhân viên không đủ mẫu ở mức chênh 5 điểm):
#   - Chọn chia theo nhân viên (20 + 20) để vừa tách được tác động tốt vừa đạt 20 cụm/nhóm, chấp nhận nâng MDE từ +5 điểm lên +6 điểm phần trăm (n_per_arm = 859, m >= 299 yêu cầu/nhân viên, DE = 6,96).
#   - Con số bất lợi báo hội đồng: nếu tác động thật chỉ là +5 điểm (0,70 -> 0,75) với n hiệu dụng = 859, power thống kê giảm còn 64,17% (thấp hơn mục tiêu 80%), tức ~35,8% nguy cơ bỏ sót hiệu quả thật ở mức 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   - Dữ liệu chạy thử: toàn mẫu 51/1.200 = 4,25%; trong phạm vi noi_dia + hang_nang là 39/982 = 3,97%.
#   - Nếu đặt ngưỡng dừng tuyệt đối 3% thì pilot sẽ dừng ngay tuần đầu; vì vậy chọn ngưỡng so với nhóm đối chứng (cao hơn >= 2 điểm phần trăm) kèm trần tuyệt đối 6% và ngưỡng 0 ca hoàn tiền trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên 12 depot; loại bỏ quoc_te (22.515 đ = 1,88x, simulated) và doi_tac (10.215 đ = 0,85x, simulated); khóa giới hạn tối đa 2 lần chạy mỗi yêu cầu (chi phí cả hệ thống thấp nhất ở B3: 6.901.220 đ, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên (mỗi bước tối thiểu 1 tuần; bước 0.50 chạy 2 tuần để đạt m >= 299 yc/người và chỉ tính chỉ số chính ở bước 0.50)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận thay cho 0,05 (power = 64,17% nếu tác động thật chỉ 5 điểm)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có — 20 nhân viên đối chứng và 20 nhân viên nhóm trợ lý làm việc song song cùng ca/tuần tại cùng 12 depot"
    spillover_risk: "Trung bình (nhân viên cùng depot có thể hỏi hoặc chia sẻ gợi ý); giảm bằng phân quyền tài khoản theo staff_id, tách hàng đợi theo nhân viên và đối chiếu log agent_suggestion_shown / staff_review_decision gắn staff_id"
    predeclared: "Có — chỉ số chính, MDE 0,06, ngưỡng an toàn, 3 luật dừng, seed phân ngẫu nhiên phân tầng theo depot và ngày quyết định 2027-01-05 chốt trước khi mở bước 0.10"
  stop_rules:
